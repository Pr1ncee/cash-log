version: "3.8"

services:
  ezbookkeeping:
    image: ezbookkeeping:latest
    container_name: ezbookkeeping
    ports:
      - "8080:8080"
    volumes:
      - ezbookkeeping_storage:/ezbookkeeping/storage
      - ezbookkeeping_log:/ezbookkeeping/log
      - ./conf/ezbookkeeping.ini:/ezbookkeeping/conf/ezbookkeeping.ini:ro
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: ezbookkeeping-postgres
    environment:
      - POSTGRES_DB=ezbookkeeping
      - POSTGRES_USER=ezbookkeeping
      - POSTGRES_PASSWORD=ezbookkeeping
    volumes:
      - ezbookkeeping_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ezbookkeeping_storage:
  ezbookkeeping_log:
  ezbookkeeping_postgres:
